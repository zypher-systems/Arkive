# Outer nginx reverse proxy (TLS here). Arkive compose web is HTTP on 127.0.0.1:3080.
# Set on the API:
#   ARKIVE_PUBLIC_URL=https://arkive.example.com
#   ARKIVE_COOKIE_SECURE=true
#
# client_max_body_size must match ARKIVE_MAX_UPLOAD_BYTES (default 10 GiB).
# The inner SPA nginx uses client_max_body_size 0 — this outer limit is the real cap.
# Replace X-Forwarded-For with $remote_addr; do not use $proxy_add_x_forwarded_for.

server {
    listen 443 ssl http2;
    server_name arkive.example.com;

    ssl_certificate     /etc/letsencrypt/live/arkive.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkive.example.com/privkey.pem;

    client_max_body_size 10G;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_method $request_method;
    }
}

server {
    listen 80;
    server_name arkive.example.com;
    return 301 https://$host$request_uri;
}
