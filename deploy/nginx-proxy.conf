# Outer nginx reverse proxy (TLS here). The Arkive container is HTTP on host port 3080.
# Set on the arkive service:
#   ARKIVE_PUBLIC_URL=https://arkive.example.com
#   ARKIVE_COOKIE_SECURE=true
#   ARKIVE_TRUSTED_PROXIES=127.0.0.1/32,172.16.0.0/12   (prod overlay default)
#
# client_max_body_size must match ARKIVE_MAX_UPLOAD_BYTES (default 10 GiB).
# Arkive itself has no body-size cap beyond ARKIVE_MAX_UPLOAD_BYTES.
# Replace X-Forwarded-For with $remote_addr; do not use $proxy_add_x_forwarded_for.

server {
    listen 443 ssl http2;
    server_name arkive.example.com;

    ssl_certificate     /etc/letsencrypt/live/arkive.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkive.example.com/privkey.pem;

    client_max_body_size 10G;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_method $request_method;
    }
}

server {
    listen 80;
    server_name arkive.example.com;
    return 301 https://$host$request_uri;
}
