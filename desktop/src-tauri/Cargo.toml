[package]
name = "arkive-desktop"
version = "0.1.0"
description = "Arkive thin WebDAV desktop helper"
authors = ["Arkive"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "arkive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
