# Production overlay. TLS belongs on an outer reverse proxy — Arkive stays HTTP.
#
#   cp .env.example .env   # set strong secrets, no placeholders
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required in .env (no defaults):
#   POSTGRES_PASSWORD
#   ARKIVE_SESSION_SECRET
#   ARKIVE_SECRETS_KEY
#   ARKIVE_BOOTSTRAP_ADMIN_EMAIL
#   ARKIVE_PUBLIC_URL          (https://arkive.example.com)
#
# Bind a host directory (or NFS mount) over /data/arkive on api if you do not
# want the named arkive_data volume. Postgres port stays unpublished. Put
# Caddy/Traefik/nginx in front of the web service (see deploy/).

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  api:
    environment:
      ARKIVE_ENV: production
      ARKIVE_DATABASE_URL: postgres://arkive:${POSTGRES_PASSWORD}@postgres:5432/arkive?sslmode=disable
      ARKIVE_DATA_DIR: ${ARKIVE_DATA_DIR:-/data/arkive}
      ARKIVE_SESSION_SECRET: ${ARKIVE_SESSION_SECRET:?set ARKIVE_SESSION_SECRET in .env}
      ARKIVE_SECRETS_KEY: ${ARKIVE_SECRETS_KEY:?set ARKIVE_SECRETS_KEY in .env}
      ARKIVE_BOOTSTRAP_ADMIN_EMAIL: ${ARKIVE_BOOTSTRAP_ADMIN_EMAIL:?set ARKIVE_BOOTSTRAP_ADMIN_EMAIL in .env}
      ARKIVE_PUBLIC_URL: ${ARKIVE_PUBLIC_URL:?set ARKIVE_PUBLIC_URL in .env}
      ARKIVE_COOKIE_SECURE: ${ARKIVE_COOKIE_SECURE:-true}
