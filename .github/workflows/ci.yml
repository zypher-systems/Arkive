name: CI

on:
  pull_request:

jobs:
  api:
    name: api (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arkive
          POSTGRES_PASSWORD: arkive
          POSTGRES_DB: arkive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkive -d arkive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Empty = every test gets a fresh SQLite database (no setup needed).
      ARKIVE_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://arkive:arkive@localhost:5432/arkive?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: api/go.sum
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test
        working-directory: api
        run: go test ./...
      - name: Test with the race detector
        if: matrix.db == 'sqlite'
        working-directory: api
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (${{ matrix.layout }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [docker-compose.yml, docker-compose.postgres.yml]
    env:
      COMPOSE_FILE: ${{ matrix.layout }}
      ARKIVE_PUBLIC_URL: http://localhost:3080
      # Known token so the smoke script can complete first-run setup.
      ARKIVE_SETUP_TOKEN: ci-setup-token
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Smoke
        run: ./scripts/smoke.sh
      - name: Restart and smoke again (data persists)
        run: |
          docker compose restart arkive
          docker compose up -d --wait
          ./scripts/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v || true
