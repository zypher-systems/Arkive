name: CI

on:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arkive
          POSTGRES_PASSWORD: arkive
          POSTGRES_DB: arkive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkive -d arkive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: api/go.sum
      - name: Test
        working-directory: api
        env:
          ARKIVE_TEST_DATABASE_URL: postgres://arkive:arkive@localhost:5432/arkive?sslmode=disable
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      ARKIVE_BOOTSTRAP_ADMIN_EMAIL: admin@arkive.local
      ARKIVE_PUBLIC_URL: http://localhost:3080
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for stack
        run: |
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3080/api/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
      - name: Smoke
        run: ./scripts/smoke.sh
      - name: Tear down
        if: always()
        run: docker compose down -v || true
