# GitLab CI for self-hosted Codevault (https://codevault.sh)
# Runner: Docker executor — tag: docker-build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags:
    - docker-build
  interruptible: true

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  FF_NETWORK_PER_BUILD: "true"

stages:
  - test
  - build

test:api:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd api
    - go test ./...
  timeout: 15m

# Build production images to prove Dockerfiles stay green.
build:api:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -f docker/Dockerfile.api -t "arkive-api:${CI_COMMIT_SHORT_SHA}" .
  timeout: 30m

build:web:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -f docker/Dockerfile.web -t "arkive-web:${CI_COMMIT_SHORT_SHA}" .
  timeout: 30m
