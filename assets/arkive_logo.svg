<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Industrial Orange / Amber Gradient -->
    <linearGradient id="arkive-orange-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />  <!-- High-Vis Orange -->
      <stop offset="50%" stop-color="#FF8800" />  <!-- Amber Accent -->
      <stop offset="100%" stop-color="#FFC700" /> <!-- Core Glow -->
    </linearGradient>

    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate/Graphite Card -->
  <rect width="100" height="100" rx="22" fill="#12141A" stroke="#262A36" stroke-width="2"/>

  <!-- Outer Vault Arch ("A" Frame) -->
  <path 
    d="M50,16 L80,72 L64,72 L50,44 L36,72 L20,72 Z" 
    fill="none" 
    stroke="url(#arkive-orange-grad)" 
    stroke-width="4.5" 
    stroke-linejoin="round"
    filter="url(#orange-glow)"
  />

  <!-- Internal Storage Vault Core / Pillar -->
  <path 
    d="M50,30 L50,82 M38,60 L62,60" 
    fill="none" 
    stroke="url(#arkive-orange-grad)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Top Vault Lock Indicator -->
  <circle cx="50" cy="22" r="3.5" fill="#FFC700" filter="url(#orange-glow)" />
</svg>
