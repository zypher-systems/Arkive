# Arkive: one app container + Postgres.
#
#   docker compose up -d
#   docker compose logs arkive | grep setup_token   # one-time first-run token
#
# Then open http://localhost:3080 and create the admin account.
# Secrets are generated on first boot into the arkive_data volume
# (/data/arkive/.arkive-secrets) unless you set them in .env.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkive}
      POSTGRES_DB: arkive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkive -d arkive"]
      interval: 5s
      timeout: 5s
      retries: 10

  arkive:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${ARKIVE_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${ARKIVE_PORT:-3080}:8080"
    environment:
      ARKIVE_DATABASE_URL: postgres://arkive:${POSTGRES_PASSWORD:-arkive}@postgres:5432/arkive?sslmode=disable
      ARKIVE_DATA_DIR: /data/arkive
      # Empty = generated on first boot and kept in /data/arkive/.arkive-secrets.
      ARKIVE_SESSION_SECRET: ${ARKIVE_SESSION_SECRET:-}
      ARKIVE_SECRETS_KEY: ${ARKIVE_SECRETS_KEY:-}
      # Optional. Empty = a one-time token is printed to the log on first boot.
      ARKIVE_SETUP_TOKEN: ${ARKIVE_SETUP_TOKEN:-}
      # Optional: this email becomes admin when it registers / logs in.
      ARKIVE_BOOTSTRAP_ADMIN_EMAIL: ${ARKIVE_BOOTSTRAP_ADMIN_EMAIL:-}
      ARKIVE_COOKIE_SECURE: ${ARKIVE_COOKIE_SECURE:-false}
      ARKIVE_PUBLIC_URL: ${ARKIVE_PUBLIC_URL:-http://localhost:3080}
      ARKIVE_MAX_UPLOAD_BYTES: ${ARKIVE_MAX_UPLOAD_BYTES:-10737418240}
      # Reverse proxy in front? List its address/CIDR so X-Forwarded-For is honoured.
      ARKIVE_TRUSTED_PROXIES: ${ARKIVE_TRUSTED_PROXIES:-}
      ARKIVE_METRICS_ENABLED: ${ARKIVE_METRICS_ENABLED:-false}
      ARKIVE_METRICS_TOKEN: ${ARKIVE_METRICS_TOKEN:-}
      # Optional OIDC — set in .env to enable SSO on the login page
      ARKIVE_OIDC_ISSUER: ${ARKIVE_OIDC_ISSUER:-}
      ARKIVE_OIDC_CLIENT_ID: ${ARKIVE_OIDC_CLIENT_ID:-}
      ARKIVE_OIDC_CLIENT_SECRET: ${ARKIVE_OIDC_CLIENT_SECRET:-}
      ARKIVE_OIDC_PROVIDER_NAME: ${ARKIVE_OIDC_PROVIDER_NAME:-SSO}
      ARKIVE_GOOGLE_CLIENT_ID: ${ARKIVE_GOOGLE_CLIENT_ID:-}
      ARKIVE_GOOGLE_CLIENT_SECRET: ${ARKIVE_GOOGLE_CLIENT_SECRET:-}
      ARKIVE_GOOGLE_REDIRECT_URL: ${ARKIVE_GOOGLE_REDIRECT_URL:-http://localhost:3080/api/auth/google/drive/callback}
      # Optional remote S3 seed (Garage, SeaweedFS, …). Empty = local folder default.
      ARKIVE_S3_ENDPOINT: ${ARKIVE_S3_ENDPOINT:-}
      ARKIVE_S3_ACCESS_KEY: ${ARKIVE_S3_ACCESS_KEY:-}
      ARKIVE_S3_SECRET_KEY: ${ARKIVE_S3_SECRET_KEY:-}
      ARKIVE_S3_BUCKET: ${ARKIVE_S3_BUCKET:-}
      ARKIVE_S3_USE_SSL: ${ARKIVE_S3_USE_SSL:-false}
    volumes:
      - arkive_data:/data/arkive
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/arkive", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      default:
        aliases:
          # Dotted name so curl stores session cookies (bare "arkive" will not).
          - arkive.local

volumes:
  postgres_data:
  arkive_data:
